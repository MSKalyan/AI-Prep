[pytest]
DJANGO_SETTINGS_MODULE = config.test_settings
python_files = tests.py test_*.py *_tests.py
addopts = -ra --cov=apps --cov-report=term --cov-branch
omit =
    */migrations/*
    */tests.py
    */test_*.py
    *_tests.py
    conftest.py
    config/*
    manage.py
    ml_utils.py
    */rag/*

